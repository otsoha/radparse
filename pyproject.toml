[project]
name = "radparse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Otso Häkkänen", email = "otso.hakkanen@aalto.fi"}
    ]
dependencies = [
