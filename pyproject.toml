[project]
name = "radparse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Otso Häkkänen", email = "otso.hakkanen@aalto.fi"}
    ]
dependencies = [
    "numpy>=2.2.6",
    "pyside6>=6.11.2",
    "seaborn>=0.13.2",
    "typer>=0.27.2",
]

[project.scripts]
radparseCLI = "radparse.cli:main_cli"
radparse = "radparse.gui:main_gui"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
